# Path-preserving reverse proxy for Meal Log at /mealplan/
#
# Include from a server { } block, for example:
#   include /path/to/nginx.mealplan.conf;
#
# Do not put a URI path on proxy_pass (no trailing slash after the port).
# `proxy_pass http://127.0.0.1:3000/;` strips /mealplan and Next.js then
# 308-redirects back onto /mealplan — that is the redirect loop.

location /mealplan {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
}
