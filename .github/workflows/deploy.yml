# Manual deploy of meal-logging to the host in the deploy environment.
#
# Required environment secrets (Settings → Environments → deploy):
#   DEPLOY_HOST      user@hostname (or user@ip) reachable from GitHub-hosted runners
#   DEPLOY_SSH_KEY   private key whose public key is authorized on that host
#                    (no passphrase)
#   DEPLOY_SSH_PORT  SSH port (defaults to 22 if unset)
#
# Put these on the deploy *environment*, not as repository secrets. Environment
# secrets are not copied to forks and are unavailable to fork workflows.
# Do not add pull_request or pull_request_target triggers to this file.

name: Deploy

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: meal-logging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to production
    if: github.repository == 'Nikash/mealplan' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Mealplan Prod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: meal-logging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "Set DEPLOY_HOST and DEPLOY_SSH_KEY on the deploy environment." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # deploy.sh uses buildx --load; the docker driver supports that.
          driver: docker

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          umask 077
          printf '%s\n' "${DEPLOY_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/deploy_key"
          host="${DEPLOY_HOST##*@}"
          host="${host%%:*}"
          port="${DEPLOY_SSH_PORT:-22}"
          if ! [[ "${port}" =~ ^[0-9]+$ ]] || (( port < 1 || port > 65535 )); then
            echo "DEPLOY_SSH_PORT must be a port number between 1 and 65535." >&2
            exit 1
          fi
          ssh-keyscan -p "${port}" -H "${host}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
          printf '%s\n' \
            'Host *' \
            "  IdentityFile ${HOME}/.ssh/deploy_key" \
            '  IdentitiesOnly yes' \
            "  Port ${port}" \
            > "${HOME}/.ssh/config"
          chmod 600 "${HOME}/.ssh/config"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: bash ./deploy.sh "${DEPLOY_HOST}"
